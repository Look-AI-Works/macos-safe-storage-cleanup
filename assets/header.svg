        <path d="m15 18 3 3 6-7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <use href="#file" x="43" y="7"/>
        <rect x="76" y="14" width="111" height="8" rx="4" fill="#7a9c9a"/>
      </g>
      <g transform="translate(24 146)">
