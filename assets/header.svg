        <rect x="0" y="5" width="12" height="9" rx="2"/><path d="M3 5V3a3 3 0 0 1 6 0v2"/>
      </g>
      <rect x="64" y="216" width="84" height="6" rx="3" fill="#bdcdc7"/>
    </g>
    <g transform="translate(1016 202)">
      <path d="M55 0 103 17v37c0 26-21 47-48 61C28 101 7 80 7 54V17z" fill="#477b74" opacity=".13" transform="translate(3 8)"/>
      <path d="M55 0 103 17v37c0 26-21 47-48 61C28 101 7 80 7 54V17z" fill="url(#badge)" stroke="#edf7ef" stroke-width="4"/>
      <path d="M55 12 92 25v28c0 20-16 37-37 50C34 90 18 73 18 53V25z" fill="none" stroke="#8bc2b5" stroke-width="1.4"/>
